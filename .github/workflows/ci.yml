name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and smoke test
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Show Swift version
        run: swift --version

      - name: Build, assemble app, and run smoke checks
        run: ./scripts/smoke.sh

      - name: Upload app bundle
        uses: actions/upload-artifact@v4
        with:
          name: SwitchPilot-ad-hoc
          path: app/SwitchPilot/.build/SwitchPilot.app
          if-no-files-found: error
