name: Release binary

# The release workflow rebuilds the universal ad-hoc zip from the tagged source
# and replaces the release assets. It intentionally does not notarize: there is
# no Developer ID certificate or Apple signing credential in this repository.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag (for example v0.7.2)
        required: true

permissions:
  contents: write

concurrency:
  group: release-binary-${{ github.event.release.tag_name || github.event.inputs.tag }}
  cancel-in-progress: false

jobs:
  package:
    name: Build universal ad-hoc zip
    runs-on: macos-15
    timeout-minutes: 30
    env:
      TAG: ${{ github.event.release.tag_name || github.event.inputs.tag }}
    steps:
      - name: Check out release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - name: Show toolchain
        run: |
          set -euo pipefail
          swift --version
          xcrun --find clang

      - name: Build ad-hoc universal package
        run: ./scripts/build-release

      - name: Verify package and version
        run: |
          set -euo pipefail
          VERSION=$(/usr/bin/plutil -extract CFBundleShortVersionString raw app/SwitchPilot/Info.plist)
          test "v${VERSION}" = "${TAG}" || {
            echo "Version/tag mismatch: v${VERSION} vs ${TAG}" >&2
            exit 1
          }
          ZIP="dist/SwitchPilot-${VERSION}-macos-universal-adhoc.zip"
          test -f "$ZIP"
          test -f "$ZIP.sha256"
          (cd dist && /usr/bin/shasum -a 256 -c "$(basename "$ZIP").sha256")
          /usr/bin/lipo -info dist/SwitchPilot.app/Contents/MacOS/SwitchPilot
          /usr/bin/lipo -info dist/SwitchPilot.app/Contents/MacOS/SwitchPilot | grep -q arm64
          /usr/bin/lipo -info dist/SwitchPilot.app/Contents/MacOS/SwitchPilot | grep -q x86_64
          /usr/bin/codesign --verify --strict dist/SwitchPilot.app
          /usr/bin/codesign -dv --verbose=4 dist/SwitchPilot.app 2>&1 | grep -q 'Signature=adhoc'
          for lang in en zh-Hans zh-Hant ja; do
            test -f "dist/SwitchPilot.app/Contents/Resources/${lang}.lproj/Localizable.strings"
            test -f "dist/SwitchPilot.app/Contents/Resources/${lang}.lproj/InfoPlist.strings"
          done
          if unzip -l "$ZIP" | grep -q '\._'; then
            echo "AppleDouble files found in release zip" >&2
            exit 1
          fi

      - name: Upload to existing release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION=$(/usr/bin/plutil -extract CFBundleShortVersionString raw app/SwitchPilot/Info.plist)
          ZIP="dist/SwitchPilot-${VERSION}-macos-universal-adhoc.zip"
          gh release upload "${TAG}" "$ZIP" "$ZIP.sha256" \
            --repo "${GITHUB_REPOSITORY}" --clobber
