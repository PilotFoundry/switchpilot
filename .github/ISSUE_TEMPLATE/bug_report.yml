name: Bug report
description: Report a reproducible problem with SwitchPilot
title: "[bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Do not include TCC databases, Keychain data,
        certificates, personal paths, or unrelated system logs.
  - type: input
    id: macos
    attributes:
      label: macOS version
      placeholder: "e.g. 27.0.1 (26A434)"
    validations:
      required: true
  - type: input
    id: app_version
    attributes:
      label: SwitchPilot version
      placeholder: "e.g. 0.7.2"
    validations:
      required: true
  - type: dropdown
    id: build_method
    attributes:
      label: Build method
      options:
        - GitHub release ad-hoc zip
        - Local build (ad-hoc)
        - Local build (development certificate)
        - Source build from another machine
    validations:
      required: true
  - type: dropdown
    id: architecture
    attributes:
      label: CPU architecture
      options:
        - Apple Silicon (arm64)
        - Intel (x86_64)
        - Not sure
    validations:
      required: true
  - type: dropdown
    id: language
    attributes:
      label: UI language
      options:
        - Follow System
        - English
        - 简体中文
        - 繁體中文
        - 日本語
    validations:
      required: true
  - type: dropdown
    id: permissions
    attributes:
      label: Permission state
      options:
        - Automation granted, Accessibility granted
        - Automation granted, Accessibility missing
        - Automation missing, Accessibility granted
        - Both missing
        - Not applicable
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Include the exact menu/panel path.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Screenshots, sanitized logs, first-launch Gatekeeper behavior, and whether the app was notarized (it is not).
    validations:
      required: false
